<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Tracker</title>
    <link rel="stylesheet" href="attendance.css">
</head>
<body>
    <main class="card">
        <h1>Student Attendance Register</h1>
        <p>Add a student, update its status and delete a record. Demo data resets on refresh.</p>
        <form id="form-design">
            <label for="student-name">Enter the student's name: </label>
                <input 
                    id="student-name"
                    type="text"
                    placeholder="Student Name"
                    required
                >

            <label for="student-detail">Enter the student's class and section: </label>
                <input
                    id="student-detail"
                    type="text"
                    placeholder="Class and Section"
                    required
                >
        </form>

        <button type="submit" id="add-student">Add Student</button>
        <p id="feedback"></p>
        <p id="summary" aria-live="polite"></p>
        <div id="record-list"></div>
    </main>
    <script src="attendance.js"></script>
</body>
</html>
