<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <h1>Calculator</h1>
    <section id="userinput">
        <input 
            id="number1"
            type="number"
            placeholder="Enter the first number: "
            required
        >

        <input
            id="number2"
            type="number"
            placeholder="Enter the second number: "
            required
        >
    </section>

    <section id="buttonconsole">
        <button id="Addition">Addition</button>
        <button id="Subtraction">Subtraction</button>
        <button id="Multiplication">Multiplication</button>
        <button id="Division">Division</button>
        <button id="Exponentiation">Exponentiation</button>
        <button id="Quotient">Quotient</button>
        <button id="Remainder">Remainder</button>
    </section>

    <p id="Output"></p>

    <script src="calculator.js"></script>
</body>
</html>
